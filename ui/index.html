<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Flux</title>
<style>
:root {
  --bg: #18181b; --bar: #202024; --tab: #2a2a2f; --tab-h: #323238; --line: #34343a;
  --fg: #ececf1; --dim: #9a9aa5; --accent: #7c9cff; --accent-bg: #7c9cff22; --ok: #5fd39b;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.3 var(--font); overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Onglets */
#tabs { height: 36px; display: flex; align-items: flex-end; gap: 2px; padding: 0 6px; background: var(--bg); }
.tab { flex: 0 1 220px; min-width: 36px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px;
  border-radius: 8px 8px 0 0; color: var(--dim); overflow: hidden; }
.tab:hover { background: var(--tab); }
.tab.on { background: var(--bar); color: var(--fg); }
.tab.asleep .t { opacity: .5; font-style: italic; }
.tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .x { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; opacity: 0; }
.tab:hover .x, .tab.on .x { opacity: .7; }
.tab .x:hover { background: var(--tab-h); opacity: 1; }
.tab .x svg { width: 12px; height: 12px; }
.fav { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700;
  background: var(--tab-h); color: var(--fg); overflow: hidden; }
.fav img { width: 16px; height: 16px; }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: r .7s linear infinite; flex: none; }
@keyframes r { to { transform: rotate(360deg); } }
#newtab { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; margin-bottom: 1px; color: var(--dim); }
#newtab:hover { background: var(--tab); color: var(--fg); }

/* Barre d'adresse */
#bar { height: 42px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bar); border-bottom: 1px solid var(--line); }
.ib { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--dim); }
.ib:hover { background: var(--tab-h); color: var(--fg); }
#omni { flex: 1; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; margin: 0 4px; border-radius: 15px; background: var(--bg); border: 1px solid transparent; }
#omni:focus-within { border-color: var(--accent); background: #141417; }
#omni svg { color: var(--dim); }
#q { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font: 14px var(--font); user-select: text; }
#q::selection { background: #7c9cff55; }
.pill { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 9px; border-radius: 13px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill:hover { background: var(--tab-h); color: var(--fg); }
#shield.on { color: var(--ok); }

/* Suggestions */
#drop { position: absolute; left: 0; right: 0; top: 78px; background: var(--bar); border-bottom: 1px solid var(--line); padding: 4px 0 6px; display: none; box-shadow: 0 12px 24px #0008; }
#drop.open { display: block; }
.row { height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 20px; margin: 0 8px; border-radius: 8px; }
.row.sel { background: var(--accent-bg); }
.row .main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .sub::before { content: "— "; }
.row svg { color: var(--dim); }
.row kbd { margin-left: auto; color: var(--dim); font: 11px var(--font); }

/* Nouvel onglet */
#ntp { position: absolute; inset: 78px 0 0; display: none; flex-direction: column; align-items: center; padding-top: 14vh; gap: 28px; }
#ntp.show { display: flex; }
#ntp h1 { font: 600 44px var(--font); letter-spacing: -1px; }
#ntp h1 span { color: var(--accent); }
#ntp p { color: var(--dim); }
#sites { display: grid; grid-template-columns: repeat(4, 108px); gap: 12px; }
.site { height: 92px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--bar); padding: 0 8px; }
.site:hover { background: var(--tab); }
.site .fav { width: 32px; height: 32px; border-radius: 8px; font-size: 15px; }
.site .fav img { width: 24px; height: 24px; }
.site span { max-width: 100%; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Réglages */
#settings { position: absolute; inset: 78px 0 0; background: var(--bg); display: none; justify-content: center; overflow: auto; padding: 32px 16px; }
#settings.show { display: flex; }
.panel { width: 560px; max-width: 100%; display: flex; flex-direction: column; gap: 4px; }
.panel h2 { font: 600 22px var(--font); margin-bottom: 12px; }
.panel h3 { color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 6px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bar); border-radius: 10px; }
.opt div { flex: 1; } .opt small { display: block; color: var(--dim); margin-top: 2px; }
.opt select, .opt input[type=number] { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
.opt input[type=number] { width: 70px; }
.opt input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.btn { padding: 7px 14px; border-radius: 7px; background: var(--tab); }
.btn:hover { background: var(--tab-h); }
#statline { color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="tabs"><button id="newtab" title="Nouvel onglet (Ctrl+T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div id="bar">
  <button class="ib" id="back" title="Précédente (Alt+←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="ib" id="fwd" title="Suivante (Alt+→)"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button class="ib" id="reload" title="Actualiser (F5)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  <label id="omni"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" spellcheck="false" autocomplete="off" placeholder="Rechercher ou saisir une adresse"></label>
  <button class="pill" id="mem" title="Mémoire totale du navigateur · onglets actifs/total"></button>
  <button class="pill" id="shield" title="Pubs et traqueurs bloqués"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><b id="nblock">0</b></button>
  <button class="ib" id="menu" title="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<div id="drop"></div>
<div id="ntp"><h1>Flux<span>.</span></h1><p>Tapez pour chercher · <b>!yt</b>, <b>!w</b>, <b>!gh</b>… pour cibler un site</p><div id="sites"></div></div>
<div id="settings"><div class="panel">
  <h2>Réglages</h2>
  <h3>Recherche</h3>
  <label class="opt"><div>Moteur de recherche</div>
    <select id="s-engine"><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="brave">Brave Search</option><option value="bing">Bing</option></select></label>
  <label class="opt"><div>Suggestions en ligne<small>Envoie la frappe au moteur pour proposer des requêtes</small></div><input type="checkbox" id="s-suggestions"></label>
  <h3>Performance</h3>
  <label class="opt"><div>Geler les onglets inactifs après<small>CPU à zéro, mémoire compressée · les onglets qui jouent du son sont épargnés</small></div><input type="number" min="1" id="s-sleep_min"> min</label>
  <label class="opt"><div>Décharger les onglets inactifs après<small>Libère toute leur mémoire, rechargés au clic · 0 = jamais</small></div><input type="number" min="0" id="s-discard_min"> min</label>
  <label class="opt"><div>Mode éco<small>Limite à 3 processus de rendu · redémarrage requis</small></div><input type="checkbox" id="s-eco"></label>
  <label class="opt"><div>Bloquer pubs et traqueurs<small>Pages plus légères et plus rapides à charger</small></div><input type="checkbox" id="s-blocker"></label>
  <h3>Données</h3>
  <div class="opt"><div>Historique<small id="histcount"></small></div><button class="btn" id="clearhist">Effacer</button></div>
  <h3>État</h3>
  <div class="opt"><div id="statline">—</div></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const send = m => window.ipc.postMessage(typeof m === 'string' ? m : JSON.stringify(m));
const BAR = 78;
const ENGINES = {
  google: 'https://www.google.com/search?q=', duckduckgo: 'https://duckduckgo.com/?q=',
  brave: 'https://search.brave.com/search?q=', bing: 'https://www.bing.com/search?q=',
};
const BANGS = {
  g: ENGINES.google, d: ENGINES.duckduckgo, b: ENGINES.brave,
  yt: 'https://www.youtube.com/results?search_query=', w: 'https://fr.wikipedia.org/w/index.php?search=',
  gh: 'https://github.com/search?q=', a: 'https://www.amazon.fr/s?k=', r: 'https://www.reddit.com/search/?q=',
  m: 'https://www.google.com/maps/search/', i: 'https://www.google.com/search?udm=2&q=',
  tr: 'https://translate.google.com/?sl=auto&tl=fr&text=', so: 'https://stackoverflow.com/search?q=',
  npm: 'https://www.npmjs.com/search?q=', rs: 'https://docs.rs/releases/search?query=',
};
const ICON_SEARCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const ICON_GO = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

let tabs = [], active = 0, settings = {}, hist = new Map();
let rows = [], sel = 0, gen = 0, typed = '', remote = [], settingsOpen = false, lastH = undefined;

/* ---------- utilitaires ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const bare = u => u.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const frecency = v => v.visits / (1 + (Date.now() / 1000 - v.last) / 86400 / 7);

function looksUrl(s) {
  if (/\s/.test(s)) return false;
  if (/^[a-z][\w+.-]*:\/\//i.test(s) || /^(about|data|file|edge|view-source):/i.test(s)) return true;
  if (/^localhost(:\d+)?(\/|$)/i.test(s) || /^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/|$)/.test(s)) return true;
  return /^[^\s\/:]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(s);
}
function toUrl(s) {
  s = s.trim();
  // « !yt chats » ou « chats !yt »
  const pre = s.match(/^!(\w+)\s+(.+)$/), post = s.match(/^(.+?)\s+!(\w+)$/);
  const [k, q] = pre ? [pre[1], pre[2]] : post ? [post[2], post[1]] : [];
  if (k && BANGS[k]) return BANGS[k] + encodeURIComponent(q);
  if (looksUrl(s)) {
    if (/^[a-z][\w+.-]*:/i.test(s) && !/^localhost:/i.test(s)) return s;
    return (/^(localhost|\d{1,3}(\.\d{1,3}){3})/i.test(s) ? 'http://' : 'https://') + s;
  }
  return (ENGINES[settings.engine] || ENGINES.google) + encodeURIComponent(s);
}

const favFailed = new Set();
function fav(url, big) {
  const h = host(url), letter = esc((h[0] || '•').toUpperCase());
  if (!h || favFailed.has(h)) return `<span class="fav">${letter}</span>`;
  let origin; try { origin = new URL(url).origin; } catch { return `<span class="fav">${letter}</span>`; }
  return `<span class="fav"><img src="${esc(origin)}/favicon.ico" data-h="${esc(h)}" data-l="${letter}" onerror="favErr(this)"></span>`;
}
function favErr(img) { favFailed.add(img.dataset.h); img.parentNode.textContent = img.dataset.l; }

/* ---------- hauteur de l'interface ---------- */
function syncHeight() {
  const t = tabs.find(t => t.id === active);
  const empty = !t || !t.url;
  let h = BAR;
  if (settingsOpen || empty) h = null;
  else if ($('#drop').classList.contains('open')) h = BAR + $('#drop').offsetHeight + 16;
  if (h !== lastH) { lastH = h; send({ t: 'height', h }); }
  $('#ntp').classList.toggle('show', empty && !settingsOpen);
}

/* ---------- onglets ---------- */
function renderTabs() {
  const box = $('#tabs'), plus = $('#newtab');
  box.querySelectorAll('.tab').forEach(e => e.remove());
  for (const t of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === active ? ' on' : '') + (t.asleep ? ' asleep' : '');
    el.title = t.title || t.url || 'Nouvel onglet';
    el.innerHTML = (t.loading ? '<span class="spin"></span>' : t.url ? fav(t.url) : '<span class="fav">+</span>') +
      `<span class="t">${esc(t.title || (t.url ? bare(t.url) : 'Nouvel onglet'))}</span><button class="x" title="Fermer (Ctrl+W)">${ICON_X}</button>`;
    el.onmousedown = e => { if (e.button === 1) { e.preventDefault(); send({ t: 'close', id: t.id }); } else if (e.button === 0 && !e.target.closest('.x')) send({ t: 'activate', id: t.id }); };
    el.querySelector('.x').onclick = () => send({ t: 'close', id: t.id });
    box.insertBefore(el, plus);
  }
  const t = tabs.find(t => t.id === active);
  if (document.activeElement !== $('#q')) $('#q').value = t ? t.url : '';
  $('#reload').innerHTML = t && t.loading ? ICON_X : '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>';
  document.title = (t && t.title) || 'Flux';
  syncHeight();
}
$('#newtab').onclick = () => send({ t: 'new' });
$('#tabs').ondblclick = e => { if (e.target.id === 'tabs') send({ t: 'new' }); };
$('#back').onclick = () => send({ t: 'back' });
$('#fwd').onclick = () => send({ t: 'forward' });
$('#reload').onclick = () => { const t = tabs.find(t => t.id === active); send({ t: t && t.loading ? 'stop' : 'reload' }); };

/* ---------- omnibox ---------- */
function localMatches(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const ql = q.toLowerCase(), out = [];
  for (const v of hist.values()) {
    const b = bare(v.url).toLowerCase(), hay = b + ' ' + v.title.toLowerCase();
    if (!words.every(w => hay.includes(w))) continue;
    let s = frecency(v);
    if (b.startsWith(ql)) s *= 6; else if (host(v.url).includes(ql)) s *= 2;
    out.push([s, v]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, 5).map(x => x[1]);
}

// Complète le domaine le plus probable directement dans le champ (comme Chrome).
function inlineComplete(q) {
  if (!q || /\s/.test(q)) return null;
  const ql = q.toLowerCase();
  let best = null, bs = 0;
  for (const v of hist.values()) {
    const b = bare(v.url).toLowerCase();
    if (!b.startsWith(ql)) continue;
    const s = frecency(v);
    if (s > bs) { bs = s; best = b; }
  }
  if (!best) return null;
  const slash = best.indexOf('/', ql.length);
  const done = slash === -1 ? best : best.slice(0, Math.max(slash, ql.length));
  return done.length > ql.length ? done : null;
}

function buildRows() {
  const q = typed.trim();
  rows = [];
  if (!q) return;
  const input = $('#q');
  const completed = input.selectionStart === typed.length && input.value.length > typed.length ? input.value : null;
  if (completed) rows.push({ icon: 'go', main: completed, url: toUrl(completed) });
  else if (looksUrl(q)) rows.push({ icon: 'go', main: q, url: toUrl(q) });
  const bang = q.match(/^!(\w+)\s+(.+)$/);
  rows.push({ icon: 'search', main: q, sub: bang && BANGS[bang[1]] ? host(BANGS[bang[1]]) : 'Rechercher', url: toUrl(q) });
  const seen = new Set(rows.map(r => r.url));
  for (const v of localMatches(q)) {
    if (seen.has(v.url)) continue; seen.add(v.url);
    rows.push({ icon: 'hist', fav: v.url, main: v.title || bare(v.url), sub: bare(v.url), url: v.url });
  }
  for (const s of remote) {
    if (rows.length >= 10) break;
    if (s.toLowerCase() === q.toLowerCase()) continue;
    const url = toUrl(s);
    if (seen.has(url)) continue; seen.add(url);
    rows.push({ icon: 'search', main: s, url });
  }
}

function renderDrop() {
  const d = $('#drop');
  sel = Math.min(sel, Math.max(rows.length - 1, 0));
  d.innerHTML = rows.map((r, i) =>
    `<div class="row${i === sel ? ' sel' : ''}" data-i="${i}">${r.icon === 'hist' ? fav(r.fav) : r.icon === 'go' ? ICON_GO : ICON_SEARCH}` +
    `<span class="main">${esc(r.main)}</span>${r.sub ? `<span class="sub">${esc(r.sub)}</span>` : ''}${i === sel ? '<kbd>Entrée</kbd>' : ''}</div>`).join('');
  d.classList.toggle('open', rows.length > 0 && document.activeElement === $('#q'));
  syncHeight();
}
$('#drop').onmousedown = e => {
  e.preventDefault();
  const r = e.target.closest('.row');
  if (r) go(rows[+r.dataset.i].url, e.button === 1 || e.ctrlKey);
};

function closeDrop() { rows = []; remote = []; renderDrop(); }
function go(url, newTab) {
  closeDrop();
  $('#q').blur();
  send(newTab ? { t: 'new', url } : { t: 'go', url });
}

let debounce;
$('#q').addEventListener('input', e => {
  const q = $('#q');
  typed = q.value;
  if (e.inputType === 'insertText' && q.selectionStart === q.value.length) {
    const c = inlineComplete(typed);
    if (c) { q.value = typed + c.slice(typed.length); q.setSelectionRange(typed.length, q.value.length); }
  }
  sel = 0;
  remote = remote.filter(s => s.toLowerCase().startsWith(typed.trim().toLowerCase()));
  buildRows(); renderDrop();
  clearTimeout(debounce);
  if (typed.trim() && settings.suggestions && !looksUrl(typed.trim()) && !typed.startsWith('!')) {
    const g = ++gen;
    debounce = setTimeout(() => send({ t: 'suggest', gen: g, q: typed.trim() }), 40);
  }
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!rows.length) return;
    e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
    renderDrop();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const v = $('#q').value.trim();
    if (!v) return;
    const url = rows[sel] ? rows[sel].url : toUrl(v);
    go(url, e.altKey);
  } else if (e.key === 'Escape') {
    const t = tabs.find(t => t.id === active);
    closeDrop();
    $('#q').value = t ? t.url : '';
    if (t && t.url) { $('#q').blur(); send({ t: 'focus_page' }); }
  } else if (e.key === 'Delete' && e.shiftKey && rows[sel] && rows[sel].icon === 'hist') {
    hist.delete(rows[sel].url); buildRows(); renderDrop();
  }
});
function focusOmni() { const q = $('#q'); q.focus(); q.select(); typed = ''; }
// Premier clic : tout sélectionner, comme Chrome.
$('#q').addEventListener('mousedown', e => { if (document.activeElement !== $('#q')) { e.preventDefault(); focusOmni(); } });
$('#q').addEventListener('blur', () => { closeDrop(); const t = tabs.find(t => t.id === active); $('#q').value = t ? t.url : ''; });

/* ---------- nouvel onglet ---------- */
function renderSites() {
  const seen = new Set(), list = [];
  for (const v of [...hist.values()].sort((a, b) => frecency(b) - frecency(a))) {
    const h = host(v.url);
    if (!h || seen.has(h)) continue;
    seen.add(h); list.push(v);
    if (list.length === 8) break;
  }
  $('#sites').innerHTML = list.map(v => `<button class="site" data-u="${esc(v.url)}">${fav(v.url)}<span>${esc(host(v.url))}</span></button>`).join('');
}
$('#sites').onclick = e => { const s = e.target.closest('.site'); if (s) go(new URL(s.dataset.u).origin + '/'); };

/* ---------- réglages ---------- */
function toggleSettings(open = !settingsOpen) {
  settingsOpen = open;
  $('#settings').classList.toggle('show', open);
  $('#histcount').textContent = `${hist.size} pages mémorisées`;
  syncHeight();
}
$('#menu').onclick = () => toggleSettings();
$('#shield').onclick = () => toggleSettings(true);
$('#mem').onclick = () => toggleSettings(true);
for (const el of document.querySelectorAll('[id^="s-"]')) {
  el.onchange = () => {
    const k = el.id.slice(2);
    settings[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Math.max(+el.min, parseInt(el.value) || 0) : el.value;
    send({ t: 'settings', s: settings });
    renderShield();
  };
}
$('#clearhist').onclick = () => { hist.clear(); send({ t: 'clear_history' }); renderSites(); toggleSettings(true); };
function fillSettings() {
  for (const [k, v] of Object.entries(settings)) {
    const el = $('#s-' + k);
    if (el) el.type === 'checkbox' ? (el.checked = v) : (el.value = v);
  }
}
function renderShield() { $('#shield').classList.toggle('on', !!settings.blocker); }

/* ---------- raccourcis clavier ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), c = e.ctrlKey || e.metaKey;
  let cmd = null;
  if (c && !e.shiftKey && k === 't') cmd = 'new';
  else if (c && e.shiftKey && k === 't') cmd = 'reopen';
  else if (c && k === 'w') cmd = 'close';
  else if (c && k === 'tab') cmd = e.shiftKey ? 'prev' : 'next';
  else if (c && k >= '1' && k <= '9') cmd = 'n' + k;
  else if ((c && k === 'l') || (e.altKey && k === 'd') || k === 'f6') { e.preventDefault(); focusOmni(); return; }
  else if (k === 'f5' || (c && k === 'r')) { e.preventDefault(); send({ t: 'reload' }); return; }
  else if (k === 'f12') { e.preventDefault(); send({ t: 'devtools' }); return; }
  else if (e.altKey && k === 'arrowleft') { e.preventDefault(); send({ t: 'back' }); return; }
  else if (e.altKey && k === 'arrowright') { e.preventDefault(); send({ t: 'forward' }); return; }
  else if (k === 'escape' && settingsOpen) { toggleSettings(false); return; }
  if (cmd) { e.preventDefault(); send(cmd); }
});
document.addEventListener('contextmenu', e => { if (e.target !== $('#q')) e.preventDefault(); });

/* ---------- messages du processus principal ---------- */
window.flux = m => {
  switch (m.t) {
    case 'tabs': {
      const changed = m.active !== active;
      tabs = m.tabs; active = m.active;
      if (changed && settingsOpen) toggleSettings(false);
      renderTabs();
      break;
    }
    case 'focus': if (settingsOpen) toggleSettings(false); focusOmni(); break;
    case 'hist':
      if (m.reset) hist = new Map();
      for (const v of m.items) hist.set(v.url, v);
      renderSites();
      break;
    case 'sugg':
      if (m.gen !== gen) return;
      remote = m.items;
      if (document.activeElement === $('#q')) { buildRows(); renderDrop(); }
      break;
    case 'settings': settings = m.s; fillSettings(); renderShield(); break;
    case 'stats': {
      const mb = m.mem / 1048576;
      $('#mem').textContent = (mb >= 1024 ? (mb / 1024).toFixed(2) + ' Go' : Math.round(mb) + ' Mo') + ` · ${m.alive}/${m.total}`;
      $('#nblock').textContent = m.blocked;
      $('#statline').textContent = `${$('#mem').textContent.split(' · ')[0]} utilisés · ${m.alive} onglet(s) actif(s) sur ${m.total} · ${m.blocked} requêtes bloquées`;
      break;
    }
  }
};
send({ t: 'ready' });
</script>
</body>
</html>
