<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Flux — recherche rapide</title>
<style>
:root { --accent: #ff5b2e; --accent-bg: #ff5b2e22; --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
[data-theme=dark] { --bg: #18181b; --line: #2e2e34; --fg: #ececf1; --dim: #9a9aa5; --chip: #2a2a2f; }
[data-theme=light] { --bg: #ffffff; --line: #e4e4e8; --fg: #18181b; --dim: #6b6b76; --chip: #f0f0f3; }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); color: var(--fg); font: 14px/1.3 var(--font); overflow: hidden; user-select: none; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#top { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px; }
#top .logo { width: 20px; height: 25px; stroke: var(--accent); stroke-width: 76; }
#q { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--fg); font: 20px var(--font); user-select: text; }
#q::placeholder { color: var(--dim); }
#q::selection { background: var(--accent-bg); }
kbd.hint { color: var(--dim); font: 12px var(--font); padding: 3px 7px; border-radius: 6px; background: var(--chip); }
#list { border-top: 1px solid var(--line); padding: 6px 0 8px; display: none; }
#list.open { display: block; }
.row { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 14px; margin: 0 8px; border-radius: 9px; }
.row.sel { background: var(--accent-bg); }
.row .main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .sub::before { content: "— "; }
.row svg { color: var(--dim); }
.row kbd { margin-left: auto; color: var(--dim); font: 11px var(--font); }
.fav { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--chip); overflow: hidden; }
.fav img { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="top">
  <svg class="logo" viewBox="152 96 258 322"><path d="M190 380V210a76 76 0 0 1 76-76h106"/><path d="M278 266h70"/></svg>
  <input id="q" spellcheck="false" autocomplete="off" placeholder="Rechercher sur le web ou saisir une adresse">
  <kbd class="hint">Échap</kbd>
</div>
<div id="list"></div>
<script>/*OMNI*/</script>
<script>
const $ = s => document.querySelector(s);
const send = m => window.ipc.postMessage(JSON.stringify(m));
let settings = {}, hist = new Map(), favs = [], rows = [], sel = 0, gen = 0, typed = '', remote = [], lastH = 0, debounce;

function render() {
  const completed = $('#q').selectionStart === typed.length && $('#q').value.length > typed.length ? $('#q').value : null;
  rows = suggestionRows(typed, completed, remote, 8);
  sel = Math.min(sel, Math.max(rows.length - 1, 0));
  $('#list').innerHTML = rows.map((r, i) => rowHtml(r, i, sel)).join('');
  $('#list').classList.toggle('open', rows.length > 0);
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  if (h !== lastH) { lastH = h; send({ t: 'height', h }); }
}
function go(url) { if (url) send({ t: 'go', url }); }

$('#q').addEventListener('input', e => {
  const q = $('#q');
  typed = q.value;
  if (e.inputType === 'insertText' && q.selectionStart === q.value.length) {
    const c = inlineComplete(typed);
    if (c) { q.value = typed + c.slice(typed.length); q.setSelectionRange(typed.length, q.value.length); }
  }
  sel = 0;
  remote = remote.filter(s => s.toLowerCase().startsWith(typed.trim().toLowerCase()));
  render();
  clearTimeout(debounce);
  if (wantsRemote(typed.trim())) { const g = ++gen; debounce = setTimeout(() => send({ t: 'suggest', gen: g, q: typed.trim() }), 40); }
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!rows.length) return;
    e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
    render();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const v = $('#q').value.trim();
    if (v) go(rows[sel] ? rows[sel].url : toUrl(v));
  } else if (e.key === 'Escape') {
    send({ t: 'hide' });
  }
});
$('#list').onmousedown = e => { e.preventDefault(); const r = e.target.closest('.row'); if (r) go(rows[+r.dataset.i].url); };
document.addEventListener('contextmenu', e => { if (e.target !== $('#q')) e.preventDefault(); });

// Clic ailleurs (autre application, bureau) : la barre se referme.
addEventListener('blur', () => setTimeout(() => { if (!document.hasFocus()) send({ t: 'hide' }); }, 120));
window.flux = m => {
  switch (m.t) {
    case 'settings': settings = m.s; applyTheme(settings); break;
    case 'hist': if (m.reset) hist = new Map(); for (const v of m.items) hist.set(v.url, v); break;
    case 'favs': favs = m.items; break;
    case 'sugg': if (m.gen === gen) { remote = m.items; render(); } break;
  }
};
send({ t: 'ready' });
$('#q').focus();
</script>
</body>
</html>
