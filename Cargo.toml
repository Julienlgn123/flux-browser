[package]
name = "flux"
version = "1.0.0"
edition = "2021"
description = "Flux — navigateur léger basé sur Chromium (WebView2), axé performance"
license = "MIT"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
webview2-com = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
adblock = "0.13"
base64 = "0.22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
tray-icon = "0.26.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
